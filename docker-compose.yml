services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicdesk
      POSTGRES_USER: clinicdesk
      # local dev only. override with POSTGRES_PASSWORD=... in a .env file next to this compose file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicdesk}
    ports:
      # 5433 on the host so it does not clash with a locally installed postgres
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicdesk -d clinicdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: clinicdesk-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://clinicdesk:${POSTGRES_PASSWORD:-clinicdesk}@postgres:5432/clinicdesk
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: compose
    image: clinicdesk-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
