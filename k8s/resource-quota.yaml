# keeps a runaway HPA or a bad load test from eating the whole cluster
apiVersion: v1
kind: ResourceQuota
metadata:
  name: clinicdesk-quota
  namespace: clinicdesk
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "30"
    persistentvolumeclaims: "5"
