# Same app for minikube, using the locally built images from values-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clinicdesk-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RJSIN147/DevopsCapstoneProject.git
    targetRevision: main
    path: helm/clinicdesk
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: clinicdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
