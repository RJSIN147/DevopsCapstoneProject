# Default values. values-dev.yaml (minikube) and values-prod.yaml (EKS) override what they need.

imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/rjsin147/clinicdesk-backend
    # CI tags every image with the git commit SHA. Empty falls back to the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  corsOrigins: ""
  # "today" and the day filter in the UI are worked out in this timezone
  clinicTimezone: Asia/Kolkata
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 384Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  image:
    repository: ghcr.io/rjsin147/clinicdesk-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

postgres:
  # set enabled=false and fill externalHost to point at RDS instead
  enabled: true
  image: postgres:17-alpine
  externalHost: ""
  port: 5432
  database: clinicdesk
  username: clinicdesk
  # only for the classroom cluster. use --set or an existing secret for anything real
  password: clinicdesk
  existingSecret: ""
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

ingress:
  enabled: false
  className: nginx
  host: clinicdesk.local
  annotations: {}
  tls: []

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    # kube-prometheus-stack picks ServiceMonitors by this label unless told otherwise
    labels:
      release: monitoring
  grafanaDashboard:
    enabled: true
