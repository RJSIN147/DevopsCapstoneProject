{{- if .Values.backend.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "clinicdesk.backendName" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
{{- end }}
