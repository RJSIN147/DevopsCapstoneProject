{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicdesk.dbSecretName" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database: {{ .Values.postgres.database | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.postgres.username (.Values.postgres.password | urlquery) (include "clinicdesk.dbHost" .) .Values.postgres.port .Values.postgres.database | quote }}
{{- end }}
