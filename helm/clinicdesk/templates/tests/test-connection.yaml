apiVersion: v1
kind: Pod
metadata:
  name: {{ include "clinicdesk.fullname" . }}-test
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # keep the pod after it passes so `helm test --logs` can still read it
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check-api
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      # the namespace has a ResourceQuota, so every pod needs requests/limits
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      command:
        - sh
        - -c
        - |
          set -e
          curl -fsS http://{{ include "clinicdesk.backendName" . }}:{{ .Values.backend.port }}/ready && echo
          curl -fsS http://{{ include "clinicdesk.frontendName" . }}/api/doctors > /dev/null
          echo "frontend -> backend proxy works"
