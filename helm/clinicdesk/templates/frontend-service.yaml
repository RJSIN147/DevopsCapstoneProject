apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicdesk.frontendName" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
    {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
