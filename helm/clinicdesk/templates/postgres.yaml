{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinicdesk.postgresName" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
    {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clinicdesk.postgresName" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
    {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "clinicdesk.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clinicdesk.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        # uid 70 is the postgres user in the alpine image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ include "clinicdesk.dbSecretName" . }}, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "clinicdesk.dbSecretName" . }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "clinicdesk.dbSecretName" . }}, key: password } }
            # a fresh EBS volume has lost+found in its root, so keep the data one level down
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
