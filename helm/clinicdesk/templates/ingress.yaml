{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clinicdesk.fullname" . }}
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # FastAPI already serves everything under /api, so no rewrite needed
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "clinicdesk.backendName" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clinicdesk.frontendName" . }}
                port:
                  number: 80
{{- end }}
