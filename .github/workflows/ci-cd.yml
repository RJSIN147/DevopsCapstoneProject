name: ClinicDesk CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "demo/**"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# a newer push to the same branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # 1. Tests and lint. Nothing gets built if any of these fail.
  # ------------------------------------------------------------------
  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend-build:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  iac-validate:
    name: Validate Helm + Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Helm lint (all value files)
        run: |
          helm lint helm/clinicdesk
          helm lint helm/clinicdesk -f helm/clinicdesk/values-dev.yaml
          helm lint helm/clinicdesk -f helm/clinicdesk/values-prod.yaml
          helm template clinicdesk helm/clinicdesk -f helm/clinicdesk/values-prod.yaml > /dev/null

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Terraform fmt / init / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # ------------------------------------------------------------------
  # 2. Build both images, scan them with Trivy, push to GHCR.
  #    Images are tagged with the commit SHA so every deploy maps back to a commit.
  # ------------------------------------------------------------------
  build-scan-push:
    name: Build, scan, push (${{ matrix.component }})
    needs: [backend-test, frontend-build, iac-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name
        id: meta
        run: |
          # GHCR needs lowercase, the GitHub username isn't
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/clinicdesk-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          trivy --version

      - name: Trivy report (all severities, for the record)
        run: |
          trivy image --no-progress --format table \
            --output trivy-${{ matrix.component }}.txt \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          trivy image --no-progress --format sarif \
            --output trivy-${{ matrix.component }}.sarif \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.*

      - name: Send results to GitHub code scanning
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      # the actual gate: any fixable HIGH or CRITICAL CVE fails the job and nothing is pushed
      - name: Trivy gate (HIGH/CRITICAL)
        run: |
          trivy image --no-progress --exit-code 1 \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore \
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.meta.outputs.image }}:${{ github.sha }}

  secret-scan:
    name: Secret scan (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      # fails if anything that looks like a real key/token (AWS, GitHub, private keys...) is committed
      - name: Scan for committed secrets
        run: trivy fs --no-progress --scanners secret --exit-code 1 .

  # ------------------------------------------------------------------
  # 3. Deploy the exact images we just pushed into a throwaway kind cluster
  #    with the real Helm chart, and check the app answers. Catches broken
  #    charts/probes/migrations before ArgoCD rolls anything out.
  # ------------------------------------------------------------------
  deploy-smoke-test:
    name: Helm deploy smoke test (kind)
    needs: [build-scan-push, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: clinicdesk-ci

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images from GHCR into kind
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for c in backend frontend; do
            img="${REGISTRY}/${owner}/clinicdesk-${c}:${GITHUB_SHA}"
            docker pull "$img"
            kind load docker-image "$img" --name clinicdesk-ci
          done
          echo "OWNER=${owner}" >> "$GITHUB_ENV"

      - name: helm upgrade --install
        run: |
          kubectl apply -f k8s/namespace.yaml
          helm upgrade --install clinicdesk ./helm/clinicdesk -n clinicdesk \
            --set backend.image.repository=${REGISTRY}/${OWNER}/clinicdesk-backend \
            --set backend.image.tag=${GITHUB_SHA} \
            --set frontend.image.repository=${REGISTRY}/${OWNER}/clinicdesk-frontend \
            --set frontend.image.tag=${GITHUB_SHA} \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.pullPolicy=Never \
            --wait --timeout 5m

      - name: Show what got deployed
        if: always()
        run: |
          kubectl get pods,svc,hpa -n clinicdesk -o wide
          kubectl get events -n clinicdesk --sort-by=.lastTimestamp | tail -20

      - name: helm test
        run: helm test clinicdesk -n clinicdesk --logs

      - name: Hit the API through the frontend service
        run: |
          kubectl port-forward -n clinicdesk svc/clinicdesk-frontend 8080:80 &
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/doctors
          when=$(date -u -d '+1 day' +%Y-%m-%dT10:00:00Z)
          curl -fsS -X POST http://localhost:8080/api/appointments \
            -H 'Content-Type: application/json' \
            -d "{\"patient_name\":\"CI Smoke\",\"doctor_id\":1,\"scheduled_at\":\"${when}\"}"
          echo
          curl -fsS http://localhost:8080/api/appointments/stats

      - name: Backend logs on failure
        if: failure()
        run: kubectl logs -n clinicdesk -l app.kubernetes.io/component=backend --all-containers --tail=100

  # ------------------------------------------------------------------
  # 4. GitOps: write the new image tag into values-prod.yaml. ArgoCD sees the
  #    commit and syncs the EKS cluster. Off by default, turn it on by creating
  #    a repository variable GITOPS_AUTO_BUMP=true (Settings -> Variables).
  # ------------------------------------------------------------------
  gitops-bump:
    name: Bump image tag for ArgoCD
    needs: deploy-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GITOPS_AUTO_BUMP == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update values-prod.yaml
        run: |
          sed -i -E "s|^(    tag: ).*|\1\"${GITHUB_SHA}\"|" helm/clinicdesk/values-prod.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/clinicdesk/values-prod.yaml
          git commit -m "Deploy ${GITHUB_SHA::7} to prod [skip ci]" || echo "nothing to change"
          git push
