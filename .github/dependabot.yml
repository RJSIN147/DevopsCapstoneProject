version: 2
updates:
  # third-party actions are pinned to commit SHAs, this keeps those pins current.
  # major versions are left alone on purpose, those get upgraded by hand after reading the changelog
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
