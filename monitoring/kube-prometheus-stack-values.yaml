# helm install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

prometheus:
  prometheusSpec:
    # pick up ServiceMonitors from every namespace, not just ones labelled for this release
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    retention: 3d
    resources:
      requests: { cpu: 200m, memory: 512Mi }

grafana:
  enabled: true
  # admin login comes from a secret you create yourself (see monitoring/README.md),
  # so no password lives in git
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      # the clinicdesk chart ships its dashboard as a ConfigMap in the app namespace
      searchNamespace: ALL

alertmanager:
  enabled: false

# EKS/minikube don't expose these control plane components, skip the noisy failing targets
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
